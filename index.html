
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Friend Test 😂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #080808, #241020, #090909);
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 400px;
    background: #151515;
    border: 1px solid #ff3b91;
    border-radius: 25px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 0 35px #ff168044;
}

.emoji {
    font-size: 65px;
    margin-bottom: 15px;
}

h1 {
    color: #ff4caa;
    margin-bottom: 15px;
}

p {
    color: #ccc;
    line-height: 1.6;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #ff4caa;
    background: #222;
    color: white;
    outline: none;
    margin-bottom: 15px;
    font-size: 16px;
}

button {
    padding: 13px 22px;
    border: none;
    border-radius: 12px;
    background: #ff3b91;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
    transition: .3s;
}

button:hover {
    transform: scale(1.06);
    background: #ff007b;
}

#result {
    margin-top: 20px;
    color: #ff75bb;
    font-size: 19px;
    font-weight: bold;
    line-height: 1.6;
}

.hidden {
    display: none;
}

.footer {
    color: #777;
    font-size: 11px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="emoji" id="emoji">😂</div>

    <h1>BEST FRIEND TEST</h1>

    <p id="question">
        তোমার বন্ধুর আসল পরিচয় বের করতে প্রস্তুত? 🤣
        <br>আগে বন্ধুর নাম লেখো!
    </p>

    <input type="text" id="name" placeholder="বন্ধুর নাম লেখো...">

    <button onclick="startTest()" id="start">
        Start Test 😂
    </button>

    <div id="game" class="hidden">
        <button onclick="answer('yes')">হ্যাঁ 😎</button>
        <button onclick="answer('no')">না 🥲</button>
    </div>

    <div id="result"></div>

    <button onclick="location.reload()" id="again" class="hidden">
        আবার খেলো 🔄
    </button>

    <div class="footer">
        MADE WITH 😂 BY SAJU_ISLAM
    </div>

</div>

<script>
let friend = "";
let step = 0;

const questions = [
    "তুমি কি নিজেকে অনেক চালাক মনে করো? 🧠",
    "তুমি কি সারাদিন মোবাইল নিয়ে পড়ে থাকো? 📱",
    "তুমি কি বন্ধুর কাছ থেকে ট্রিট খাও? 🍔",
    "তুমি কি আসলে একটা পাগল? 🤣"
];

function startTest() {
    friend = document.getElementById("name").value.trim();

    if (!friend) {
        alert("আগে বন্ধুর নাম লেখো! 😂");
        return;
    }

    document.getElementById("start").classList.add("hidden");
    document.getElementById("name").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    showQuestion();
}

function showQuestion() {
    if (step < questions.length) {
        document.getElementById("question").innerText =
            friend + ", " + questions[step];
    } else {
        finish();
    }
}

function answer(value) {
    step++;
    showQuestion();
}

function finish() {
    document.getElementById("game").classList.add("hidden");
    document.getElementById("emoji").innerText = "💀";

    document.getElementById("question").innerText =
        "TEST COMPLETE! 😂";

    document.getElementById("result").innerHTML =
        "Congratulations " + escapeHTML(friend) +
        "! 🎉<br><br>" +
        "তোমার রেজাল্ট: 100% পাগল 🤣<br>" +
        "তুমি পৃথিবীর সেরা আজব বন্ধু! 🗿❤️";

    document.getElementById("again").classList.remove("hidden");
}

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(c) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c];
    });
}
</script>

</body>
</html>
